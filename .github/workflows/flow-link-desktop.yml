name: Flow Link Desktop

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional GitHub Release tag to create/update, for example flow-link-v0.1.0"
        required: false
        default: ""
      worker_url:
        description: "Optional Worker WebSocket URL baked into Flow Link"
        required: false
        default: ""
      sign_macos:
        description: "Use Apple Developer ID signing/notarization secrets for the macOS build"
        required: false
        default: "false"
  push:
    tags:
      - "flow-link-v*"

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      FLOW_LINK_DEFAULT_WORKER_URL: ${{ github.event.inputs.worker_url || vars.FLOW_LINK_DEFAULT_WORKER_URL || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact-name: flow-link-macos
            build-command: pnpm flow-link:desktop:build:mac
            artifact-path: |
              apps/flow-link/src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            artifact-name: flow-link-windows
            build-command: pnpm flow-link:desktop:build:windows
            artifact-path: |
              apps/flow-link/src-tauri/target/release/bundle/nsis/*.exe
              apps/flow-link/src-tauri/target/release/bundle/msi/*.msi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/flow-link/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm build

      - name: Prepare Apple notarization key
        if: matrix.os == 'macos-latest' && inputs.sign_macos == 'true'
        shell: bash
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -n "$APPLE_API_KEY_CONTENT" ] && [ -n "$APPLE_API_KEY" ]; then
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
            echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          fi

      - name: Build Flow Link
        if: matrix.os != 'macos-latest' || inputs.sign_macos != 'true'
        run: ${{ matrix.build-command }}
        env:
          TAURI_WINDOWS_SIGNTOOL_PATH: ${{ secrets.TAURI_WINDOWS_SIGNTOOL_PATH }}

      - name: Build signed Flow Link for macOS
        if: matrix.os == 'macos-latest' && inputs.sign_macos == 'true'
        run: ${{ matrix.build-command }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

      - name: Upload installers to GitHub Release
        if: github.event_name == 'push' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Flow Link ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: ${{ matrix.artifact-path }}
          fail_on_unmatched_files: true
