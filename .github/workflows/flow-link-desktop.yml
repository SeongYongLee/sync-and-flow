name: Flow Link Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "flow-link-v*"

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact-name: flow-link-macos
            build-command: pnpm flow-link:desktop:build:mac
            artifact-path: |
              apps/flow-link/src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            artifact-name: flow-link-windows
            build-command: pnpm flow-link:desktop:build:windows
            artifact-path: |
              apps/flow-link/src-tauri/target/release/bundle/nsis/*.exe
              apps/flow-link/src-tauri/target/release/bundle/msi/*.msi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/flow-link/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm build

      - name: Build Flow Link
        run: ${{ matrix.build-command }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
