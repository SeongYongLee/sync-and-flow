name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/flow-link/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test web and worker logic
        run: pnpm test

      - name: Build web
        run: pnpm build

      - name: Test Flow Link native bridge
        run: cargo test --manifest-path apps/flow-link/src-tauri/Cargo.toml
