name: Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy web viewer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_FLOW_LINK_MAC_DOWNLOAD_URL: ${{ vars.VITE_FLOW_LINK_MAC_DOWNLOAD_URL }}
      VITE_FLOW_LINK_WINDOWS_DOWNLOAD_URL: ${{ vars.VITE_FLOW_LINK_WINDOWS_DOWNLOAD_URL }}
      VITE_SYNC_FLOW_VIEWER_URL: ${{ vars.VITE_SYNC_FLOW_VIEWER_URL }}
      VITE_SYNC_FLOW_WORKER_URL: ${{ vars.VITE_SYNC_FLOW_WORKER_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck TypeScript
        run: pnpm typecheck

      - name: Typecheck Worker
        run: pnpm typecheck:worker

      - name: Build
        run: pnpm build

      - name: Ensure Cloudflare Pages project
        run: pnpm dlx wrangler@latest pages project create sync-and-flow --production-branch main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: pnpm dlx wrangler@latest pages deploy dist --project-name sync-and-flow --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
